{% extends "base.html" %}
{% block content %}
<section class="auth-section">
  <form class="form-card" method="post">
    <p class="eyebrow">JOIN ADAJAR DENTAL</p><h1>Create account</h1>
    <div class="two-col">
      <label>First name<input name="first_name" maxlength="50" autocomplete="given-name" required></label>
      <label>Last name<input name="last_name" maxlength="50" autocomplete="family-name" required></label>
    </div>
    <label>Contact number<input name="contact" type="tel" maxlength="20" autocomplete="tel" required></label>
    <label>Email address<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
    <label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required><small>At least 8 characters.</small></label>
    <label>Confirm password<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="btn full" type="submit">Create account</button>
    <p class="form-note">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
  </form>
</section>
{% endblock %}
